name: Deploy isolated iPhone 14 TTS preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ios14-vieneu-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build isolated EPUB Library with Piper and VieNeu
        run: |
          cd library
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          npm run verify:dist
          mkdir -p ../dist/library
          cp -a dist/. ../dist/library/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
